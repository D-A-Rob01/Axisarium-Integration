name: Kybernion Android

on:
  pull_request:
    paths:
      - "cartomancy_engine/android-app/**"
      - "cartomancy_engine/src/cartomancy_engine/data/**"
  push:
    branches: ["**"]
    paths:
      - "cartomancy_engine/android-app/**"
      - "cartomancy_engine/src/cartomancy_engine/data/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cartomancy_engine/android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify artwork and Android unit tests
        run: ./gradlew verifyTarotAssets testDebugUnitTest assembleDebug assembleRelease --stacktrace
