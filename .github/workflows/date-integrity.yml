name: Date Integrity

on:
  pull_request:
    paths:
      - "aletheion.py"
      - "run-daily-aletheion.ps1"
      - "tools/run_aletheion_guarded.py"
      - "tools/validate_topologos_source.py"
      - "tests/**"
      - ".github/workflows/date-integrity.yml"
  push:
    branches: [main]
    paths:
      - "aletheion.py"
      - "run-daily-aletheion.ps1"
      - "tools/run_aletheion_guarded.py"
      - "tools/validate_topologos_source.py"
      - "tests/**"
      - ".github/workflows/date-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-date-contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile guarded tools
        run: python -m py_compile tools/run_aletheion_guarded.py tools/validate_topologos_source.py
      - name: Run date-integrity regression tests
        run: python -m unittest tests.test_date_integrity
      - name: Run existing observation tests
        run: python -m unittest tests.test_observations
