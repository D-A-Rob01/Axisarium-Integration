[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "melographion"
version = "0.1.0"
description = "A local resonance-session engine for Spotify, audio features, and Obsidian notes."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "David" }]
dependencies = [
  "librosa>=0.10",
  "networkx>=3.2",
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "soundfile>=0.12",
  "spotipy>=2.24",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
melographion = "melographion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
